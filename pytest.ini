[pytest]
markers =
    smoke: Fast critical-path checks (run on every PR)
    regression: Full regression suite (run nightly)
    ui: UI tests via Playwright
    api: API tests via requests
    integration: Combined API + UI + mobile tests
    mobile: Mobile/BrowserStack tests
    security: Tenant isolation / security boundary tests

addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html

testpaths = tests