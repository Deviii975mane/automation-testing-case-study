name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"   # nightly full regression at 02:00 UTC

jobs:
  smoke:
    name: Smoke Tests (PR)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run smoke + API tests
        env:
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TOKEN_1001: ${{ secrets.TOKEN_1001 }}
          TOKEN_1002: ${{ secrets.TOKEN_1002 }}
        run: pytest -m "smoke or api" --html=reports/report.html --self-contained-html
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: reports/

  regression:
    name: Full Regression (Nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps
      - name: Run full regression in parallel
        env:
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TOKEN_1001: ${{ secrets.TOKEN_1001 }}
          TOKEN_1002: ${{ secrets.TOKEN_1002 }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: pytest -m "regression or integration" -n auto --html=reports/report.html --self-contained-html
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: reports/